# Overlay adding Gotenberg (headless LibreOffice behind a small HTTP API) to the same
# compose project/network as the rest of the stack, so it gets the container-DNS name
# "gotenberg" on the meet.jitsi network -- used by exhibit-service to convert a published
# Office document (docx/xlsx/pptx) to PDF (see exhibit-service/src/lib/gotenbergClient.ts
# and routes/exhibits.ts's POST /:id/complete handler, and its GOTENBERG_URL config,
# FOR-53). MUST be brought up together with docker-compose.yml (and usually
# exhibit-service.yml) in one invocation, e.g.:
#
#   docker compose --env-file .env -f docker-compose.yml -f jibri.yml -f exhibit-service.yml -f gotenberg.yml up -d
#
# The published port is bound to 127.0.0.1 only, matching jicofo/jvb's own admin-port
# convention (docker-compose.yml's JICOFO_REST_PORT/JVB_COLIBRI_PORT) -- Gotenberg's convert
# endpoint has no auth of its own, so it must never be reachable from outside the box.
# During local dev, exhibit-service runs as a plain host process (see Makefile's `dev` target),
# not a container, so it reaches Gotenberg via this published host port
# (GOTENBERG_URL=http://localhost:3010 in exhibit-service/.env) rather than the container-DNS
# name, which only resolves for other containers on the meet.jitsi network -- in staging,
# where exhibit-service itself runs as a container (exhibit-service.yml), it uses the internal
# http://gotenberg:3000 instead (see .env.staging.example).
#
# On the "no outbound network from Gotenberg" isolation goal (migration plan's "Isolation"
# section): tried and reverted putting Gotenberg on its own `internal: true` network instead
# of meet.jitsi -- confirmed live that Docker does not publish ports at all for a container
# whose only network is internal (`docker port` shows nothing bound, connections to
# 127.0.0.1:3010 are refused even though the container itself is healthy), which would have
# broken local dev's only path to Gotenberg. True network-level egress-deny for one
# container on an otherwise-normal bridge network isn't something plain Compose networking
# can express -- it needs a host-level iptables DOCKER_USER rule, which is out of scope for
# a Compose-file-only change. mem_limit/cpus below (confirmed applied via `docker inspect`)
# remain as real defense-in-depth against a resource-exhausted LibreOffice process (e.g. a
# decompression-bomb OOXML/ODF file), alongside gotenbergClient.ts's request timeout and
# exhibits.ts's pre-Gotenberg size cap -- network egress-deny is a follow-up, not done here.
services:
    gotenberg:
        image: gotenberg/gotenberg:8
        restart: ${RESTART_POLICY:-unless-stopped}
        ports:
            - '127.0.0.1:3010:3000'
        networks:
            meet.jitsi:
        mem_limit: 1g
        cpus: 2
